<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Log in — Delta Scalper</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="auth-wrap">
  <div class="auth-card">
    <h1>Delta Scalper</h1>
    <div class="sub">Log in to your own dashboard</div>

    {% if error %}<div class="auth-error">{{ error }}</div>{% endif %}
    {% if info %}<div class="auth-error" style="background:rgba(232,163,61,0.1); border-color:rgba(232,163,61,0.3); color:var(--amber);">{{ info }}</div>{% endif %}

    <form method="POST" action="/login">
      <label for="username">Username</label>
      <input type="text" id="username" name="username" required autofocus>

      <label for="password">Password</label>
      <input type="password" id="password" name="password" required>

      <button type="submit">Log in</button>
    </form>

    <div class="auth-switch">No account yet? <a href="/register">Create one</a></div>
  </div>
</div>
</body>
</html>
