<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Aurelius Algo{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

{% macro coin_glyph(size=34) -%}
<svg class="coin" width="{{ size }}" height="{{ size }}" viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg">
  <circle cx="20" cy="20" r="18" fill="none" stroke="#c9a227" stroke-width="1.1" opacity="0.85"/>
  <circle cx="20" cy="20" r="14.5" fill="none" stroke="#e8c46b" stroke-width="0.8" opacity="0.55"/>
  <g stroke="#c9a227" stroke-width="1" opacity="0.7">
    <line x1="20" y1="2.5" x2="20" y2="6"/>
    <line x1="20" y1="34" x2="20" y2="37.5"/>
    <line x1="2.5" y1="20" x2="6" y2="20"/>
    <line x1="34" y1="20" x2="37.5" y2="20"/>
    <line x1="7.4" y1="7.4" x2="9.8" y2="9.8"/>
    <line x1="30.2" y1="30.2" x2="32.6" y2="32.6"/>
    <line x1="32.6" y1="7.4" x2="30.2" y2="9.8"/>
    <line x1="9.8" y1="30.2" x2="7.4" y2="32.6"/>
  </g>
  <circle cx="20" cy="20" r="3" fill="#e8c46b"/>
</svg>
{%- endmacro %}

{% block body %}{% endblock %}

<script src="{{ url_for('static', filename='app.js') }}"></script>
{% block scripts %}{% endblock %}
</body>
</html>
